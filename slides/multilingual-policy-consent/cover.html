<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; box-sizing: border-box; }
    .slide-container { width: 1280px; min-height: 720px; background: #f7f2ea; color: #0A4A25; display: grid; grid-template-columns: 1fr 420px; align-items: stretch; }
    .main { padding: 94px 0 0 120px; display: flex; flex-direction: column; justify-content: space-between; min-height: 720px; }
    .eyebrow { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.15em; color: #D90429; text-transform: uppercase; }
    h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 68px; font-weight: 600; line-height: 1.06; letter-spacing: -0.045em; max-width: 680px; }
    .subtitle { font-family: Arial, sans-serif; font-size: 25px; line-height: 1.45; color: #2D3748; max-width: 610px; }
    .footer { font-family: Arial, sans-serif; font-size: 17px; color: #607064; letter-spacing: 0.04em; }
    .side { background: #0A4A25; color: #E8F3EC; display: flex; flex-direction: column; justify-content: space-between; padding: 88px 76px 62px 56px; }
    .side-number { font-family: Georgia, 'Times New Roman', serif; font-size: 168px; line-height: 0.78; letter-spacing: -0.09em; color: #D90429; }
    .side-label { font-family: Arial, sans-serif; font-size: 19px; line-height: 1.55; letter-spacing: 0.08em; text-transform: uppercase; }
    .rule { width: 88px; height: 8px; background: #D90429; }
  </style>
</head>
<body>
  <div class="slide-container">
    <section class="main">
      <div>
        <p class="eyebrow">SokDak · Private Beta Readiness</p>
        <div style="height: 34px;"></div>
        <h1>다국어 커뮤니티<br>정책 동의 시스템</h1>
        <div style="height: 30px;"></div>
        <p class="subtitle">한국 거주 외국인 학습자를 위한 안전한 참여 경험과 증빙 가능한 동의 원장</p>
      </div>
      <p class="footer">비공개 베타 출시 준비 · Android 우선</p>
    </section>
    <aside class="side">
      <p class="side-number">01</p>
      <div>
        <div class="rule"></div>
        <div style="height: 22px;"></div>
        <p class="side-label">Safety<br>Evidence<br>Inclusion</p>
      </div>
    </aside>
  </div>
</body>
</html>
