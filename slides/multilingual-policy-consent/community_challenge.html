<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; box-sizing: border-box; }
    .slide-container { width: 1280px; min-height: 720px; background: #E8F3EC; color: #0A4A25; display: grid; grid-template-columns: 610px 670px; }
    .left { padding-top: 72px; padding-left: 120px; padding-right: 35px; position: relative; }
    .number { font-family: Georgia, 'Times New Roman', serif; font-size: 138px; line-height: 0.8; color: #D90429; opacity: 0.92; }
    h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 48px; line-height: 1.06; letter-spacing: -0.045em; margin-top: -32px; position: relative; }
    .lead { font-family: Arial, sans-serif; font-size: 20px; line-height: 1.45; color: #43514A; margin-top: 26px; max-width: 420px; }
    .points { margin-top: 42px; display: grid; gap: 17px; }
    .point { display: grid; grid-template-columns: 26px 1fr; gap: 13px; align-items: start; font-family: Arial, sans-serif; font-size: 18px; line-height: 1.34; color: #2D3748; }
    .dot { width: 12px; height: 12px; margin-top: 6px; background: #D90429; }
    .right { display: flex; justify-content: center; align-items: center; background: #DDEBE2; }
    .image-wrap { width: 420px; height: 650px; display: flex; align-items: center; justify-content: center; }
    .image-wrap img { width: 390px; height: 640px; object-fit: contain; }
    .caption { position: absolute; left: 120px; top: 650px; font-family: Arial, sans-serif; font-size: 13px; color: #607064; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <div class="slide-container">
    <section class="left">
      <p class="number">02</p>
      <h1>커뮤니티 참여의<br>핵심 과제</h1>
      <p class="lead">다국어 학습자는 안전한 분위기와 명확한 참여 기준을 동시에 필요로 합니다.</p>
      <div class="points">
        <div class="point"><span class="dot"></span><span><strong>1차 대상</strong>은 영어·일본어·스페인어·베트남어 원어민입니다.</span></div>
        <div class="point"><span class="dot"></span><span>가입 후 커뮤니티 탭에서 <strong>정책 확인은 필수</strong>입니다.</span></div>
        <div class="point"><span class="dot"></span><span><strong>읽기는 열고, 쓰기는 동의 후</strong>에만 허용합니다.</span></div>
        <div class="point"><span class="dot"></span><span>운영은 가능하게, 개인 신원 노출은 <strong>최소화</strong>합니다.</span></div>
      </div>
      <p class="caption">Community entry should feel guided, not punitive.</p>
    </section>
    <section class="right">
      <div class="image-wrap"><img src="/home/ubuntu/sokdak/design-proposals/sokdak-community-guest-redesign.png" alt="SokDak 커뮤니티 게스트 화면 목업"></div>
    </section>
  </div>
</body>
</html>
